plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.mimo.findyoudevice'
    compileSdk 34

    defaultConfig {
        applicationId "com.mimo.findyoudevice"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // KSP 备选：此处使用 kapt (Room compiler)
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
    aaptOptions {
        // m4a 不压缩，保证 assets openFd() 可定位（内置报警音）
        noCompress += 'm4a'
    }
}

dependencies {
    // ---- AndroidX 基础 ----
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // ---- Material Design 3 (动态颜色/Material You) ----
    implementation 'com.google.android.material:material:1.12.0'

    // ---- 架构组件 (ViewModel + LiveData + Runtime) ----
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // ---- ViewPager2 (主机/客户端 Fragment 切换) ----
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // ---- Kotlin Coroutines ----
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // ---- Room (数据库持久化) ----
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
}